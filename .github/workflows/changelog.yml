name: Релиз проекта

on:
  workflow_dispatch:
    inputs:
      updateType:
        description: Тип релиза
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch

jobs:
  changelog:
    uses: ExEr7um/workflows/.github/workflows/git-cliff.yml@v0.13.1
    with:
      updateType: ${{ inputs.updateType }}
      versionCommand: npm pkg set version="${VERSION#v}"

  release:
    runs-on: ubuntu-latest
    needs: changelog
    steps:
      - name: Запуск деплоя
        uses: peter-evans/repository-dispatch@v4.0.1
        with:
          event-type: deploy
